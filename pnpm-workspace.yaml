# `packages` is required by pnpm 9 (Railway's builder), which otherwise fails
# with "packages field missing or empty". Declaring the root makes this a valid
# single-package workspace; the lockfile already uses "." as its only importer,
# so --frozen-lockfile still matches. The keys below are read by the local
# pnpm 11 supply-chain wrapper and are harmlessly ignored by pnpm 9.
packages:
  - .
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - isbot@5.1.44

# browserslist 4.28.7 corrige GHSA de crash/prototype write via browserslist-stats.
# Transitivo do Babel (via @react-router/dev); os dependentes aceitam '>= 4.21.0'.
overrides:
  browserslist: '^4.28.7'
  # qs 6.16.0 corrige DoS via isBuffer e o bypass de arrayLimit; nao ha
  # versao 6.15.x corrigida. express@4 e body-parser declaram '~6.15.1'
  # por conservadorismo — o 6.16.0 e minor sem breaking change (o unico
  # ajuste de parsing exige throwOnLimitExceeded, que nao e o default).
  qs: '^6.16.0'
